<div class="login-container">
  <div class="login-card">
    <div class="logo-section">
      <img src="assets/logo.png" alt="Logo" class="logo">
      <h2>Admin Login</h2>
    </div>
    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" [(ngModel)]="email" name="email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="password" name="password" required placeholder="Enter your password">
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <p class="back-link"><a routerLink="/home">Back to Home</a></p>
  </div>
</div>
