<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Manage Members</h2>
    <button class="btn btn-primary" (click)="onAdd()">Add New Member</button>
  </div>

  <div class="members-grid">
    @for (member of members; track member.id) {
      <div class="member-card" [class.disabled]="!member.isActive">
        <div class="member-img">
          <img [src]="member.image" [alt]="member.name">
          @if (!member.isActive) {
            <div class="disabled-overlay">Disabled</div>
          }
        </div>
        <div class="member-info">
          <h4>{{ member.name }}</h4>
          <p>{{ member.role }}</p>
        </div>
        <div class="member-actions">
          <button class="btn btn-sm btn-outline-primary" (click)="onEdit(member)">Edit</button>
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch" [id]="'switch_' + member.id" [checked]="member.isActive" (change)="onToggleStatus(member)">
            <label class="form-check-label" [for]="'switch_' + member.id">{{ member.isActive ? 'Enabled' : 'Disabled' }}</label>
          </div>
          <button class="btn btn-sm btn-outline-danger" (click)="onDelete(member)">Delete</button>
        </div>
      </div>
    }
  </div>
</div>

<!-- Modal -->
@if (showModal) {
<div class="modal-backdrop fade show"></div>
<div class="modal fade show" style="display: block;" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ isEditing ? 'Edit Member' : 'Add Member' }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="onSave()">
          <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" [(ngModel)]="currentMember.name" name="name" required>
          </div>
          <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <input type="text" class="form-control" id="role" [(ngModel)]="currentMember.role" name="role" required>
          </div>
          <div class="mb-3">
            <label for="imageUpload" class="form-label">Upload Image</label>
            <input type="file" class="form-control" id="imageUpload" accept="image/*">
          </div>
          <div class="mb-3">
            <label for="image" class="form-label">Image URL</label>
            <input type="text" class="form-control" id="image" [(ngModel)]="currentMember.image" name="image" required disabled>
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" role="switch" id="modalSwitch" [(ngModel)]="currentMember.isActive" name="isActive">
            <label class="form-check-label" for="modalSwitch">Active</label>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
}
