<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Manage Media</h2>
    <button class="btn btn-primary" (click)="onAdd()">Add New Media</button>
  </div>

  <div class="media-grid">
    @for (item of mediaItems; track item.id) {
      <div class="media-card" [class.disabled]="!item.isActive">
        <div class="media-img">
          <img [src]="item.image" [alt]="item.title">
          @if (!item.isActive) {
            <div class="disabled-overlay">Disabled</div>
          }
        </div>
        <div class="media-info">
          <h4>{{ item.title }}</h4>
        </div>
        <div class="media-actions">
          <button class="btn btn-sm btn-outline-primary" (click)="onEdit(item)">Edit</button>
          <div class="form-check form-switch mb-0">
            <input class="form-check-input" type="checkbox" role="switch" [id]="'switch_' + item.id" [checked]="item.isActive" (change)="onToggleStatus(item)">
            <label class="form-check-label" [for]="'switch_' + item.id">{{ item.isActive ? 'Enabled' : 'Disabled' }}</label>
          </div>
          <button class="btn btn-sm btn-outline-danger" (click)="onDelete(item)">Delete</button>
        </div>
      </div>
    }
  </div>
</div>

<!-- Modal -->
@if (showModal) {
<div class="modal-backdrop fade show"></div>
<div class="modal fade show" style="display: block;" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ isEditing ? 'Edit Media' : 'Add Media' }}</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <form (ngSubmit)="onSave()">
          <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" class="form-control" id="title" [(ngModel)]="currentMedia.title" name="title" required>
          </div>
          <div class="mb-3">
            <label for="image" class="form-label">Image URL</label>
            <input type="text" class="form-control" id="image" [(ngModel)]="currentMedia.image" name="image" required>
          </div>
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" role="switch" id="modalSwitch" [(ngModel)]="currentMedia.isActive" name="isActive">
            <label class="form-check-label" for="modalSwitch">Active</label>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
            <button type="submit" class="btn btn-primary">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
}
