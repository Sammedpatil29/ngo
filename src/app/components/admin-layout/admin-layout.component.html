<div class="d-flex flex-column" style="height: 100vh; overflow: hidden;">

      <div class="row align-items-center justify-content-between g-2">

          <h5 class="m-0 text-secondary">Admin Panel</h5>
        </div>
        <div class="col-12 col-md-auto">
          <div class="dropdown">
            <button class="btn btn-outline-secondary dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <strong>Menu</strong>
            </button>
            <ul class="dropdown-menu dropdown-menu-end w-100">
              <li><a class="dropdown-item" routerLink="admin-volunteers" routerLinkActive="active">Volunteers</a></li>

              <li><a class="dropdown-item" routerLink="admin-services" routerLinkActive="active">Services</a></li>

              <li><a class="dropdown-item" routerLink="admin-media" routerLinkActive="active">Media</a></li>
              <!-- <li><a class="dropdown-item" routerLink="admin-donation" routerLinkActive="active">Donation</a></li> -->

              <!-- <li><a class="dropdown-item" href="#">Profile</a></li> -->
              <li><a class="dropdown-item" (click)="logOut()">Sign out</a></li>
            </ul>
          </div>
        </div>
      </div>
    </header>
    
    <div class="container-fluid px-4">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
